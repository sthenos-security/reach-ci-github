name: Reachable Auto Remediation

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: write
  pages: write
  id-token: write

jobs:
  reachable:
    uses: sthenos-security/reach-ci-github/.github/workflows/auto-remediate.yml@v1
    with:
      target_branch: main
      fail_on: exploitable
      remediate: true
      rescan_only: false
      ai_mode: openai-codex
      max_batches: 3
      rescan_strategy: each_batch
      create_pr: true
      # publish_cloud: false   # keep scans in CI even when REACHABLE_API_KEY is set
    # Picks up OPENAI_API_KEY (required) and, if present, the optional
    # REACHABLE_API_KEY that links scans to your Security Center organization.
    secrets: inherit
