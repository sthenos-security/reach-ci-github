name: Setup Reachable
description: Install or update Reachable and report cache evidence.

inputs:
  dist-repo:
    description: Fallback distribution repository containing install.sh when the first-party installer is unavailable.
    required: false
    default: sthenos-security/reach-dist
  dist-base-url:
    description: Optional candidate distribution base URL containing latest.json and wheel assets.
    required: false
    default: ""
  fresh-scan:
    description: Delete ~/.reachable before installation.
    required: false
    default: "false"
  source-ref:
    description: >-
      Optional. reach-core ref (branch/tag/SHA) to install FROM SOURCE via
      reach-core's scripts/ci-preflight.sh --mode source, skipping install.sh
      entirely. Empty (default) keeps today's wheel install, unchanged. This
      is the one shared preflight every Reachable pipeline uses internally.
    required: false
    default: ""
  source-token:
    description: Credential for a private reach-core clone (source-ref only). Also REACH_CORE_TOKEN.
    required: false
    default: ""
  agent:
    description: >-
      Optional. claude|codex. When set (source-ref only today -- ci-preflight.sh
      validates the credential for ANY mode, but this action's wheel path has
      no agent-credential step to gate), makes one real API call with that
      agent's credential before install starts and fails loudly if it's
      missing, invalid, or out of credit -- instead of discovering that after
      a scan already ran.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Restore Reachable cache
      if: ${{ inputs.fresh-scan != 'true' }}
      uses: actions/cache/restore@v4
      with:
        path: ~/.reachable
        key: reachable-${{ runner.os }}-${{ github.repository_id }}-latest-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          reachable-${{ runner.os }}-${{ github.repository_id }}-latest-
          reachable-${{ runner.os }}-${{ github.repository_id }}-
          reachable-${{ runner.os }}-

    - name: Install Reachable FROM SOURCE
      if: ${{ inputs.source-ref != '' }}
      shell: bash
      env:
        SOURCE_REF: ${{ inputs.source-ref }}
        SOURCE_TOKEN: ${{ inputs.source-token }}
        AGENT: ${{ inputs.agent }}
      run: |
        set -euo pipefail
        if [ "${{ inputs.fresh-scan }}" = "true" ]; then
          echo "Reachable fresh scan requested: deleting ~/.reachable."
          rm -rf "$HOME/.reachable"
        fi
        # Fetch only the one shared script at this ref -- no second clone
        # logic duplicated here. ci-preflight.sh's own --ref/--token path
        # does the actual reach-core clone.
        preflight="${RUNNER_TEMP:-/tmp}/ci-preflight.sh"
        auth_header=()
        if [ -n "${SOURCE_TOKEN}" ]; then
          auth_header=(-H "Authorization: token ${SOURCE_TOKEN}")
        fi
        curl -fsSL "${auth_header[@]}" \
          "https://raw.githubusercontent.com/sthenos-security/reach-core/${SOURCE_REF}/scripts/ci-preflight.sh" \
          -o "$preflight"
        chmod +x "$preflight"
        agent_flag=()
        case "${AGENT}" in
          claude|codex) agent_flag=(--agent "${AGENT}") ;;
        esac
        "$preflight" --mode source --ref "${SOURCE_REF}" --token "${SOURCE_TOKEN}" "${agent_flag[@]}"

    - name: Install Reachable
      if: ${{ inputs.source-ref == '' }}
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ inputs.fresh-scan }}" = "true" ]; then
          echo "Reachable fresh scan requested: deleting ~/.reachable."
          rm -rf "$HOME/.reachable"
        fi
        mkdir -p "$HOME/.reachable"
        echo "$HOME/.reachable/venv/bin" >> "$GITHUB_PATH"
        echo "$HOME/.reachable/tools/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.reachable/venv/bin:$HOME/.reachable/tools/bin:$PATH"
        install_script="${RUNNER_TEMP:-/tmp}/reachable-install.sh"
        public_installer_url="https://sthenosec.com/download/install.sh"
        fallback_installer_url="https://raw.githubusercontent.com/${{ inputs.dist-repo }}/main/install.sh"
        if [ -n "${{ inputs.dist-base-url }}" ]; then
          export REACHABLE_DIST_BASE_URL="${{ inputs.dist-base-url }}"
          echo "Using Reachable candidate dist base URL: ${REACHABLE_DIST_BASE_URL}"
        fi
        install_args=(--update)
        for attempt in 1 2 3; do
          if curl -fsSL "$public_installer_url" -o "$install_script" && bash "$install_script" "${install_args[@]}"; then
            break
          fi
          echo "Reachable public installer attempt ${attempt} failed; trying fallback repo installer." >&2
          if curl -fsSL "$fallback_installer_url" -o "$install_script" && bash "$install_script" "${install_args[@]}"; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "Reachable installer failed after ${attempt} attempts." >&2
            exit 2
          fi
          echo "Reachable installer attempt ${attempt} failed; retrying." >&2
          sleep 5
        done
        reachctl version
        echo "Reachable cache size: $(du -sh "$HOME/.reachable" 2>/dev/null | awk '{print $1}' || echo 0)"

    - name: Save Reachable cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ~/.reachable
        key: reachable-${{ runner.os }}-${{ github.repository_id }}-latest-${{ github.run_id }}-${{ github.run_attempt }}
